name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 8
      - name: Build GitHub trophy SVG
        run: |
          set -euo pipefail
          TROPHY_URL="https://github-profile-trophy.vercel.app/?username=${{ github.repository_owner }}&theme=nord&no-frame=true&no-bg=true&column=-1&title=-Followers"
          OUTPUT_FILE="profile-summary-card-output/nord_dark/github-trophies.svg"
          mkdir -p "$(dirname "$OUTPUT_FILE")"
          curl -fsSL "$TROPHY_URL" -o "$OUTPUT_FILE"
          grep -qi "<svg" "$OUTPUT_FILE"
      - name: Update README trophy src and push
        run: |
          set -euo pipefail
          RAW_TROPHY_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/profile-summary-card-output/nord_dark/github-trophies.svg"
          perl -0pi -e 's|https://github-profile-trophy\.vercel\.app/\?[^"]*|'"$RAW_TROPHY_URL"'|g' README.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile-summary-card-output/nord_dark/github-trophies.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: build GitHub trophy SVG"
            git pull --rebase origin main
            git push
          fi
